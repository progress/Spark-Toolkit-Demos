[AppServer.Agent.@APPNAME@]
    numInitialSessions=5
    PROPATH=${CATALINA_BASE}/openedge,${CATALINA_BASE}/ablapps/@APPNAME@/openedge,${CATALINA_BASE}/openedge/Spark.pl,${DLC}/tty/netlib/OpenEdge.Net.pl,${DLC}/tty
    sessionActivateProc=Sports/activate.p
    sessionDeactivateProc=Sports/deactivate.p
    sessionShutdownProc=Sports/shutdown.p
    sessionStartupProc=Sports/startup.p
    sessionStartupProcParam={"ConfigDir": "sports"}

[AppServer.SessMgr.@APPNAME@]
    agentLogEntryTypes=ASPlumbing,DB.Connects
    agentLogFile=${catalina.base}/logs/@APPNAME@.agent.{yyyy-mm-dd}.log
    agentStartupParam=-T ${catalina.base}/temp -pf ${catalina.base}/openedge/startup.pf
    maxABLSessionsPerAgent=5
    maxAgents=1
    minAgents=1
    numInitialAgents=1
